name: SpeechPrompt-v2
channels:
  - nvidia ## 03/13 Added. Ensures pytorch-cuda is avalilable
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.9 ## 03/13 Modify from 3.11 to 3.9
  - pip=23.3.1  # Latest stable
  - setuptools
  - wheel=0.42.0  # Recent version
  - pytorch  # Latest (e.g., 2.2.0+ as of Feb 2025)
  - torchvision  # Latest compatible (e.g., 0.17.0+)
  - torchaudio  # Latest compatible (e.g., 2.2.0+)
  - cudatoolkit=11.8  # Modern CUDA for PyTorch
  - numpy=1.26.2  # Recent version
  - pysoundfile=0.12.1  # Updated
  - scipy=1.11.4  # Updated
  - pandas=2.2.0  # Added for data handling
  - scikit-learn=1.3.2  # Updated
  - jiwer=3.0.5  # Updated, speech evaluation
  - sacrebleu=2.4.0  # Updated, text evaluation
  - tqdm=4.66.1  # Updated
  - matplotlib=3.8.2  # Updated
  - jupyterlab=4.0.9  # Updated, interactive dev
  - ipython=8.18.1  # Updated
  - pyyaml=6.0.1  # Minor update
  - requests=2.31.0  # Updated
  - tensorboard=2.15.1  # Updated
  - bitarray=2.9.2  # Updated, kept from new file
  - gcc_linux-64  # Re-added for building
  - gxx_linux-64  # Re-added for building
  - binutils_linux-64  # Re-added for building
  - hydra-core==1.3.2  # Updated, config management
  - omegaconf==2.3.0  # Updated, pairs with hydra
  - pip:
      - librosa==0.10.1  # Updated, key audio tool
      - GitPython==3.1.40  # Updated, git integration
      - editdistance==0.6.2  # Alternative to python-levenshtein
      - black==24.2.0  # Updated, code formatting
      - tensorboardx==2.6.2.2  # Updated, visualization
      - sacremoses==0.1.1  # Updated, tokenization
      - -e ../../envs/custom_packages/fairseq  # Editable fairseq